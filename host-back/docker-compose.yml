name: sepol-host

services:
  db:
    image: postgres:16-alpine
    container_name: sepol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposto só em 127.0.0.1: acessível pela sua máquina/VPS, nunca pela internet
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: sepol-api
    restart: unless-stopped
    env_file: .env

    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: development

    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3333}:3333"
    volumes:
      # Fotos de documento dos hóspedes — inclua no backup junto com o banco
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
