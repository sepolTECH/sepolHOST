# Nginx da VPS para o Sepol Host.
# Copie para /etc/nginx/sites-available/sepol-host, troque SEU-DOMINIO e rode o Certbot
# (ele acrescenta o HTTPS e o redirecionamento 80 -> 443 sozinho). Veja o DEPLOY.md, passo 7.

server {
    listen 80;
    listen [::]:80;
    server_name SEU-DOMINIO;            # ex.: host.seudominio.com.br

    # Site (build do host-front), gerado pelo deploy/deploy.sh
    root /var/www/sepol-host;
    index index.html;

    # Uploads (fotos de documento/anexos). A API limita o corpo JSON a 1 MB; aqui há folga.
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Cabeçalhos de segurança (o HSTS só vale depois que o HTTPS estiver ativo)
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;

    # API (Node/Express em Docker, publicada só em 127.0.0.1:3333)
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # A API (helmet) já manda esses cabeçalhos; evita duplicar/conflitar com os acima
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # Arquivos com hash no nome: cache de 1 ano
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida cai no index.html; nunca cacheia o index
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
